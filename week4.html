<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Webpage Using DOM & JS</title>
    <style>
        body{
            font-family: Arial;
            text-align: center;
            background-color: lightblue;
        }

        h1{
            color: darkblue;
        }

        button{
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
        }

        ul{
            list-style-type: square;
            width: 200px;
            margin: auto;
            text-align: left;
        }
    </style>
</head>

<body>

    <h1 id="heading">Welcome to DOM Example</h1>

    <button id="btn1">Change Heading</button><br>
    <button id="btn2">Change Background</button>
    <input type="text", id="newcolor" , placeholder ="Enter color"><br>
    <button id="btn3">Add List Item</button>
    <input type="text", id="newitem" , placeholder ="Enter item">

    <ul id="myList">
        <li>IronMan</li>
        <li>Hulk</li>
    </ul>

<script>

function changeText() {
    var text = document.getElementById("heading");
    text.innerHTML = "Dynamic Webpage Using HTML, CSS & JavaScript";
}

function changeColor() {
    var color = document.getElementById("newcolor").value;
    document.body.style.backgroundColor = color;
    document.getElementById("newcolor").value="";
}

function addItem() {
    var text = document.getElementById("newitem").value;
    var item = document.createElement("li");
    item.innerHTML = text;
    document.getElementById("myList").appendChild(item);
    document.getElementById("newitem").value="";
}

var changetext = document.getElementById("btn1");
changetext.addEventListener("click", changeText);
var changecolor = document.getElementById("btn2");
changecolor.addEventListener("click", changeColor);
var additem = document.getElementById("btn3");
additem.addEventListener("click", addItem);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Test 4 - Dynamic DOM Manipulation & Form Validation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Interactive Lab Task Manager</h1>
            <p>Practice Test 4: Dynamic Event Handling, Form Validation & DOM Updates</p>
        </header>

        <!-- Form Card -->
        <section class="card">
            <h2>Add New Lab Task</h2>
            <form id="task-form" novalidate>
                <div class="input-group">
                    <label for="task-title">Task Title *</label>
                    <input type="text" id="task-title" placeholder="e.g., Implement Express Authentication Router">
                    <span class="error-msg" id="title-error"></span>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="task-category">Category *</label>
                        <select id="task-category">
                            <option value="">Select Category</option>
                            <option value="Frontend">Frontend (HTML/CSS/JS)</option>
                            <option value="Backend">Backend (Node/Express)</option>
                            <option value="Database">Database (MongoDB)</option>
                        </select>
                        <span class="error-msg" id="category-error"></span>
                    </div>

                    <div class="input-group">
                        <label for="task-priority">Priority *</label>
                        <select id="task-priority">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="add-btn" class="btn btn-add">Add Task to List</button>
            </form>
        </section>

        <!-- Dynamic List & Search Controls -->
        <section class="card">
            <div class="list-header">
                <h2>Task Records (<span id="task-count">0</span>)</h2>
                <input type="text" id="search-input" placeholder="🔍 Search tasks...">
            </div>

            <table id="task-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Task Title</th>
                        <th>Category</th>
                        <th>Priority</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="task-body">
                    <!-- Dynamic Rows Will Be Injected Here -->
                </tbody>
            </table>
            <div id="empty-state" class="empty-msg">No lab tasks added yet. Fill out the form above to add your first task!</div>
        </section>
    </div>

    <!-- Notification Alert -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>

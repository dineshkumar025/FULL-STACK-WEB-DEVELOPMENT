<!DOCTYPE html>
<html>

<head>

    <title>Student Profile Manager</title>

    <style>

        body {
            font-family: Arial;
            background-color: #eaf4ff;
            text-align: center;
            margin: 40px;
        }

        h1 {
            color: #174a7e;
        }

        input {
            width: 380px;
            padding: 10px;
            margin: 6px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            background-color: #174a7e;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            margin: 8px;
        }

        #profile {
            width: 430px;
            margin: 25px auto;
            padding: 20px;
            background-color: white;
            border: 2px solid #174a7e;
            border-radius: 8px;
            box-shadow: 3px 3px 8px #aaa;
            text-align: left;
        }

        #profile h2 {
            color: #174a7e;
            text-align: center;
        }

        #profile p {
            font-size: 16px;
        }

    </style>

</head>

<body>

    <h1>Student Profile Manager</h1>

    <h2>Enter Student Details</h2>

    <input type="text" id="name" placeholder="Enter Name">
    <br>

    <input type="text" id="roll" placeholder="Enter Roll Number">
    <br>

    <input type="text" id="department" placeholder="Enter Department">
    <br>

    <input type="number" id="cgpa" placeholder="Enter CGPA">
    <br>

    <button onclick="createProfile()">Create Profile</button>

    <div id="profile"></div>

    <script>

        class Student {

            constructor(name, roll, department, cgpa) {
                this.name = name;
                this.roll = roll;
                this.department = department;
                this.cgpa = cgpa;
            }

        }

        function createProfile() {

            var name = document.getElementById("name").value;
            var roll = document.getElementById("roll").value;
            var department = document.getElementById("department").value;
            var cgpa = document.getElementById("cgpa").value;

            var student = new Student(name, roll, department, cgpa);

            var profile = document.getElementById("profile");

            profile.innerHTML =
                "<h2>Student Profile</h2>" +
                "<p><b>Name</b> : " + student.name + "</p>" +
                "<p><b>Roll No</b> : " + student.roll + "</p>" +
                "<p><b>Department</b> : " + student.department + "</p>" +
                "<p><b>CGPA</b> : " + student.cgpa + "</p>";
        }

    </script>

</body>

</html>

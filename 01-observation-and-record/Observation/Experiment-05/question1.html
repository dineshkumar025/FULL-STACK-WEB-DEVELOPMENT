<!DOCTYPE html>
<html>
<head>
    <title>Question 1 - Interactive Product Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f4f4;
        }
        .box {
            background: white;
            padding: 20px;
            width: 300px;
            border-radius: 8px;
            box-shadow: 0 0 10px #ccc;
        }
        input {
            width: 90%;
            padding: 8px;
            margin: 8px 0;
        }
        h3 {
            color: green;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Product Calculator</h2>
        
        <label>Product Name:</label><br>
        <input type="text" id="productName" value="Laptop"><br>

        <label>Price (₹):</label><br>
        <input type="number" id="price" value="50000"><br>

        <label>Quantity:</label><br>
        <input type="number" id="quantity" value="1"><br>

        <h3>Total Amount: ₹<span id="total">50000</span></h3>
    </div>

    <script>
        function calculateTotal() {
            let price = document.getElementById("price").value;
            let qty = document.getElementById("quantity").value;

            let total = price * qty;
            document.getElementById("total").innerHTML = total;
        }

        document.getElementById("price").addEventListener("input", calculateTotal);
        document.getElementById("quantity").addEventListener("input", calculateTotal);
    </script>

</body>
</html>
